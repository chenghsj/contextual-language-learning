name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject non-pnpm lockfiles
        run: |
          if git ls-files --cached --others --exclude-standard -- 'package-lock.json' '**/package-lock.json' 'npm-shrinkwrap.json' '**/npm-shrinkwrap.json' 'yarn.lock' '**/yarn.lock' | grep -q .; then
            echo "::error::This repository uses pnpm. Remove npm/yarn lockfiles."
            exit 1
          fi
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node apps/extension/scripts/check-build.mjs
      - run: node apps/local-host/scripts/smoke-host.mjs
      - name: Install and smoke real Linux Native Host launcher
        run: |
          node scripts/install-host.mjs aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --browser chromium
          test -f "$HOME/.config/chromium/NativeMessagingHosts/dev.contextual.language_learning.json"
          node apps/local-host/scripts/smoke-host.mjs "$HOME/.local/share/contextual-language-learning/native-host/launch.sh"
          node scripts/uninstall-host.mjs --browser chromium
          test ! -e "$HOME/.config/chromium/NativeMessagingHosts/dev.contextual.language_learning.json"
          test ! -e "$HOME/.local/share/contextual-language-learning/native-host"
      - name: Package and verify release archives
        run: |
          pnpm package:release
          (cd release-assets && sha256sum -c SHA256SUMS)
      - name: Upload downloadable preview packages
        uses: actions/upload-artifact@v4
        with:
          name: release-preview-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  windows-host:
    name: Windows Host install and binary stdio
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node apps/local-host/scripts/smoke-host.mjs
      - name: Register and exercise real Windows Native Host executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            node scripts/install-host.mjs aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --browser chrome
            if ($LASTEXITCODE -ne 0) { throw 'Windows Host installer failed' }
            $launcher = Join-Path $env:LOCALAPPDATA 'Contextual Language Learning\native-host\native-host.exe'
            if (!(Test-Path -LiteralPath $launcher)) { throw 'Native Host .exe not created' }
            node apps/local-host/scripts/smoke-host.mjs "$launcher"
            if ($LASTEXITCODE -ne 0) { throw 'Windows Native Host stdio smoke failed' }
            node scripts/uninstall-host.mjs --browser chrome
            if ($LASTEXITCODE -ne 0) { throw 'Windows Host uninstall failed' }
            if (Test-Path -LiteralPath $launcher) { throw 'Windows Host launcher remains after uninstall' }
          } finally {
            node scripts/uninstall-host.mjs --browser chrome
            if ($LASTEXITCODE -ne 0) { throw 'Windows Host cleanup failed' }
          }

  macos-host:
    name: macOS Host install and native stdio
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: Register and exercise macOS Native Host launcher
        run: |
          node scripts/install-host.mjs aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --browser edge
          test -f "$HOME/Library/Application Support/Microsoft Edge/NativeMessagingHosts/dev.contextual.language_learning.json"
          node apps/local-host/scripts/smoke-host.mjs "$HOME/Library/Application Support/Contextual Language Learning/native-host/launch.sh"
          node scripts/uninstall-host.mjs --browser edge
          test ! -e "$HOME/Library/Application Support/Microsoft Edge/NativeMessagingHosts/dev.contextual.language_learning.json"
          test ! -e "$HOME/Library/Application Support/Contextual Language Learning/native-host"
