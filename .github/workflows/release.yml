name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, such as v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-speech:
    name: Build universal macOS speech helper
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node apps/local-host/scripts/build-macos-speech.mjs
      - run: node apps/local-host/scripts/build-macos-siri.mjs
      - run: node apps/local-host/scripts/build-macos-credentials.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: macos-speech
          path: |
            apps/local-host/dist/macos-speech*
            apps/local-host/dist/macos-credentials
          if-no-files-found: error

  chromium:
    needs: macos-speech
    name: Build and publish Chromium release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tags and source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and verify existing release tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Tag must be vMAJOR.MINOR.PATCH, optionally with a prerelease suffix" >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            echo "Tag $tag does not exist. Create and push it before publishing." >&2
            exit 1
          fi
          git checkout --detach "refs/tags/$tag"
          version="$(node -p "require('./package.json').version")"
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match package.json version $version" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject non-pnpm lockfiles
        run: |
          if git ls-files --cached --others --exclude-standard -- 'package-lock.json' '**/package-lock.json' 'npm-shrinkwrap.json' '**/npm-shrinkwrap.json' 'yarn.lock' '**/yarn.lock' | grep -q .; then
            echo "::error::This repository uses pnpm. Remove npm/yarn lockfiles."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test

      - name: Build Extension and bundled Native Host
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          VITE_HOST_SETUP_DOWNLOAD_URL: https://github.com/chenghsj/contextual-language-learning/releases/tag/v${{ env.RELEASE_VERSION }}
        run: |
          test -n "$GOOGLE_OAUTH_CLIENT_ID" || { echo "::error::Set GOOGLE_OAUTH_CLIENT_ID for one-click Drive authorization"; exit 1; }
          pnpm build

      - name: Validate Extension and Native Host
        run: |
          node apps/extension/scripts/check-build.mjs
          node apps/local-host/scripts/smoke-host.mjs

      - name: Download macOS speech helper
        # The Ubuntu packager consumes the helper built from the same ref on macOS.
        uses: actions/download-artifact@v4
        with:
          name: macos-speech
          path: apps/local-host/dist

      - name: Package Chromium and graphical Host setups with bundled runtimes
        env:
          CLL_CHROME_EXTENSION_ID: ${{ vars.CLL_CHROME_EXTENSION_ID }}
          CLL_EDGE_EXTENSION_ID: ${{ vars.CLL_EDGE_EXTENSION_ID }}
          CLL_CHROMIUM_EXTENSION_ID: ${{ vars.CLL_CHROMIUM_EXTENSION_ID }}
        run: |
          sudo apt-get update && sudo apt-get install -y mono-mcs libmono-system-windows-forms4.0-cil
          pnpm package:release

      - name: Verify ZIPs and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS
          chromium="contextual-language-learning-chromium-$RELEASE_VERSION.zip"
          unzip -tq "$chromium"
          unzip -Z -1 "$chromium" | grep -Eq '^(\./)?manifest\.json$'
          for platform in macos windows linux; do
            for arch in arm64 x64; do
              host="contextual-language-learning-$platform-$arch-setup-$RELEASE_VERSION.zip"
              unzip -tq "$host"
              unzip -Z -1 "$host" | grep -Eq '(^|/)dist/native-host\.mjs$'
              unzip -Z -1 "$host" | grep -Eq '(^|/)setup/server\.mjs$'
              unzip -Z -1 "$host" | grep -Eq '(^|/)runtime/node(\.exe)?$'
            done
          done

      - name: Write installation notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Chromium Extension
          The normal setup uses the browser-store extension with its fixed ID.
          The Chromium ZIP is for unpacked development/testing; pair it with
          a local-mode setup package if its ID differs from the store build.

          ## Local service
          Download the setup ZIP for your operating system and processor, then extract it.
          Open CLL 本機服務.app on macOS, Setup.exe on Windows, or CLL Setup.desktop on Linux.
          Choose your browser and click Install. Return to the extension and check the connection.
          Node.js is included. No terminal commands or source repository are needed.
          Reopen Setup to update or uninstall; lessons, settings and sign-ins are preserved.

          Linux requires a graphical desktop and xdg-open. Browser store identities must
          match the IDs configured for this release. All archives are covered by SHA256SUMS.
          Google Drive OAuth remains experimental and macOS-only.
          EOF

      - name: Publish GitHub Release and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "Contextual Language Learning $RELEASE_TAG" \
              --notes-file release-notes.md \
              --verify-tag
          fi
